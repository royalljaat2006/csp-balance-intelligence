name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # PostgreSQL, like production: the bank-flow and comparison code uses Postgres-only SQL
  # (DISTINCT ON, LATERAL, jsonb), so a SQLite run cannot exercise it.
  DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - name: Lint
        run: uv run ruff check app
      - name: Type check
        run: uv run mypy app
      - name: Django system check
        run: uv run python app/manage.py check
      - name: Migration check (no missing migrations)
        run: uv run python app/manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest tests
      - name: Dependency vulnerability scan
        run: |
          uv export --no-hashes --no-dev -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt || echo "::warning::pip-audit found known vulnerabilities — see job log"

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t csp-balance-tracker:ci .
