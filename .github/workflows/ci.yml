name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "sqlite:///dev.sqlite3"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - name: Lint
        run: uv run ruff check app
      - name: Type check
        run: uv run mypy app
      - name: Django system check
        run: uv run python app/manage.py check
      - name: Migration check (no missing migrations)
        run: uv run python app/manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest tests
      - name: Dependency vulnerability scan
        run: |
          uv export --no-hashes --no-dev -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt || echo "::warning::pip-audit found known vulnerabilities — see job log"

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t csp-balance-tracker:ci .
