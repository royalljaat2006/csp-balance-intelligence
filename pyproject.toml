[project]
name = "csp-balance-tracker"
version = "0.1.0"
description = "Tracks CSP monthly average balance vs SBI Rule #19 slabs; exposes an API for consuming dashboards."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2,<5.3",
  "django-ninja>=1.3,<2",
  "django-environ>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "gspread>=6.1,<7",
  "google-auth>=2.34,<3",
  "pandera[pandas]>=0.20,<1",
  "structlog>=24.4,<25",
  "whitenoise>=6.7,<7",
  "openai>=1.50,<2",
  "requests>=2.32,<3",
  "django-redis>=5.4,<6",
  "rq>=2.0,<3",
  "urllib3>=2.8,<3",
  "oauthlib>=4.0,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "django-stubs>=5.1,<6",
]
dbt = [
  "dbt-core>=1.8,<2",
  "dbt-postgres>=1.8,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "app"

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
pythonpath = ["app"]
testpaths = ["tests"]

[tool.uv]
package = false
