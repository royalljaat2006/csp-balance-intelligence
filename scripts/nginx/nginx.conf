# Local/staging load balancer in front of the stateless `web` tier
# (scalability foundation, 2026-09-21). Uses Docker's embedded DNS
# (127.0.0.11) with a short TTL instead of a static `upstream {}` block —
# `upstream` resolves hostnames once at nginx startup, so it would keep
# hitting only whichever `web` replica existed when nginx booted even
# after `docker compose up -d --scale web=N` adds more. Putting the
# hostname in a variable forces nginx to re-resolve per the `resolver`
# TTL, which is what actually load-balances across replicas that come and
# go. Docker Compose's own embedded DNS already round-robins `web` across
# every running replica, so this is a real (if minimal) load balancer, not
# just a pass-through.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    client_max_body_size 20m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
