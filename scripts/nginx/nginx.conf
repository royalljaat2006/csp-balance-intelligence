# Local/staging load balancer in front of the stateless `web` tier
# (scalability foundation, 2026-09-21). Uses Docker's embedded DNS
# (127.0.0.11) with a short TTL instead of a static `upstream {}` block —
# `upstream` resolves hostnames once at nginx startup, so it would keep
# hitting only whichever `web` replica existed when nginx booted even
# after `docker compose up -d --scale web=N` adds more. Putting the
# hostname in a variable forces nginx to re-resolve per the `resolver`
# TTL, which is what actually load-balances across replicas that come and
# go. Docker Compose's own embedded DNS already round-robins `web` across
# every running replica, so this is a real (if minimal) load balancer, not
# just a pass-through.
resolver 127.0.0.11 valid=10s;

# Keep the scheme an outer proxy (the host Nginx that terminates TLS) already reported; only fall
# back to this server's own scheme when there is none. Overwriting it with "http" made Django think
# every HTTPS request was plain HTTP.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;

    client_max_body_size 20m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        # $http_host, not $host: $host drops the port, so a browser at http://127.0.0.1:8210 sent
        # Origin ...:8210 while Django saw Host 127.0.0.1, and every login POST failed the CSRF
        # origin check. $http_host passes the Host header exactly as the client sent it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
